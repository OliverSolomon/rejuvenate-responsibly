
name: Deploy Rejuvenate Responsibly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rejuvenate-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js for the build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the production application
      - name: Build Next.js
        run: npm run build

      # 5. Verify standalone output
      - name: Verify standalone build
        run: |
          set -eu

          if [ ! -f .next/standalone/server.js ]; then
            echo "ERROR: .next/standalone/server.js not found."
            echo "Ensure next.config.js enables output: 'standalone'."
            exit 1
          fi

          echo "Standalone build verified."

      # 6. Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_PORT:?Missing SSH_PORT secret}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          cat > "$HOME/.ssh/config" <<EOF
          Host production-vps
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

          test -f "$HOME/.ssh/config"
          test -f "$HOME/.ssh/deploy_key"

          echo "Testing SSH connection..."
          ssh -F "$HOME/.ssh/config" \
            -o BatchMode=yes \
            production-vps \
            'printf "SSH connection successful\n"'

      # 7. Prepare VPS and verify prerequisites
      - name: Prepare VPS
        run: |
          set -eu

          ssh -F "$HOME/.ssh/config" production-vps '
            set -eu

            APP_DIR="/var/www/rejuvenateresponsibly.com/app"

            command -v rsync >/dev/null
            command -v systemctl >/dev/null
            command -v curl >/dev/null

            test -f /etc/rejuvenateresponsibly.env
            test -f /etc/systemd/system/rejuvenateresponsibly.service

            mkdir -p "$APP_DIR"
            test -w "$APP_DIR"

            echo "VPS prerequisites verified."
          '

      # 8. Upload standalone application
      - name: Upload application
        run: |
          set -eu

          test -f "$HOME/.ssh/config"

          rsync -az --delete \
            --exclude='.next/static/' \
            -e "ssh -F $HOME/.ssh/config" \
            .next/standalone/ \
            production-vps:/var/www/rejuvenateresponsibly.com/app/

      # 9. Upload Next.js static assets
      - name: Upload static assets
        run: |
          set -eu

          ssh -F "$HOME/.ssh/config" production-vps \
            'mkdir -p /var/www/rejuvenateresponsibly.com/app/.next/static'

          rsync -az --delete \
            -e "ssh -F $HOME/.ssh/config" \
            .next/static/ \
            production-vps:/var/www/rejuvenateresponsibly.com/app/.next/static/

      # 10. Upload public assets, if present
      - name: Upload public assets
        run: |
          set -eu

          if [ -d public ]; then
            ssh -F "$HOME/.ssh/config" production-vps \
              'mkdir -p /var/www/rejuvenateresponsibly.com/app/public'

            rsync -az --delete \
              -e "ssh -F $HOME/.ssh/config" \
              public/ \
              production-vps:/var/www/rejuvenateresponsibly.com/app/public/
          fi

      # 11. Restart the native systemd service
      - name: Restart application
        run: |
          set -eu

          ssh -F "$HOME/.ssh/config" production-vps '
            set -eu
            sudo -n systemctl restart rejuvenateresponsibly.service
          '

      # 12. Verify application health
      - name: Verify deployment
        run: |
          set -eu

          ssh -F "$HOME/.ssh/config" production-vps '
            set -eu

            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 \
                http://127.0.0.1:3000/ \
                -o /dev/null; then

                echo "Deployment successful."

                sudo -n systemctl is-active \
                  rejuvenateresponsibly.service

                exit 0
              fi

              sleep 2
            done

            echo "ERROR: Application health check failed."

            sudo -n journalctl \
              -u rejuvenateresponsibly.service \
              -n 100 \
              --no-pager || true

            exit 1
          '
