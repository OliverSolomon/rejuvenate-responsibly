name: Deploy Rejuvenate Responsibly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rejuvenate-responsibly-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check build-time settings
        run: |
          set -eu

          # NEXT_PUBLIC_ variables are compiled into the browser bundle, so they
          # have to be present here. The server reads its own copy at runtime
          # from /etc/rejuvenateresponsibly.env, which is too late for these.
          missing=""

          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "WARNING: not set as repository variables:$missing"
            echo "The site will deploy, but admin sign-in at /dashboard will not"
            echo "work until they are set under Settings > Secrets and variables"
            echo "> Actions > Variables."
          fi
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare standalone deployment
        run: |
          set -eu

          if [ ! -f .next/standalone/server.js ]; then
            echo "ERROR: .next/standalone/server.js is missing."
            echo "Check that next.config.ts includes output: 'standalone'."
            find .next -maxdepth 4 -name server.js -print || true
            exit 1
          fi

          mkdir -p .next/standalone/.next/static

          if [ -d .next/static ]; then
            cp -a .next/static/. .next/standalone/.next/static/
          fi

          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -a public/. .next/standalone/public/
          fi

          test -f .next/standalone/server.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -eu

          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "ERROR: Configure SSH_HOST and SSH_PRIVATE_KEY in GitHub repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          cat > ~/.ssh/config <<EOF
          Host production
            HostName $SSH_HOST
            User deployer
            Port 693
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

      - name: Verify server prerequisites
        run: |
          set -eu

          ssh production '
            set -eu
            command -v docker >/dev/null || {
              echo "ERROR: Docker is not installed on the server."
              exit 1
            }
            docker info >/dev/null
            test -d /var/www/rejuvenateresponsibly.com/app
            test -f /etc/rejuvenateresponsibly.env || {
              echo "ERROR: /etc/rejuvenateresponsibly.env is missing."
              exit 1
            }
          '

      - name: Upload standalone application
        run: |
          set -eu

          # .data holds the submitted assessments. It lives inside the app
          # directory and is not part of the build, so --delete would wipe it on
          # every deployment.
          rsync -az --delete \
            --exclude '.data/' \
            -e "ssh -F ~/.ssh/config" \
            .next/standalone/ \
            production:/var/www/rejuvenateresponsibly.com/app/

      - name: Deploy Docker container
        run: |
          set -eu

          ssh production 'bash -s' <<'REMOTE'
          set -eu

          APP_DIR="/var/www/rejuvenateresponsibly.com/app"
          CONTAINER="rejuvenateresponsibly"
          IMAGE="node:22-bookworm-slim"

          cd "$APP_DIR"
          test -f server.js

          docker pull "$IMAGE"

          # Replace the existing container.
          docker rm -f "$CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --init \
            --env-file /etc/rejuvenateresponsibly.env \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -p 127.0.0.1:3000:3000 \
            -v "$APP_DIR:/app" \
            -w /app \
            "$IMAGE" \
            node server.js

          sleep 5

          if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" | grep -qx true; then
            echo "ERROR: Application container did not stay running."
            docker logs --tail 100 "$CONTAINER" || true
            exit 1
          fi

          echo "Deployment container is running."
          docker ps --filter "name=$CONTAINER"
          REMOTE

      - name: Verify application response
        run: |
          set -eu

          ssh production '
            set -eu

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:3000/ \
                -o /dev/null; then
                echo "Application is responding successfully."
                exit 0
              fi

              sleep 5
            done

            echo "ERROR: Application did not respond on port 3000."
            docker logs --tail 100 rejuvenateresponsibly
            exit 1
          '

      - name: Clean up SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/config
